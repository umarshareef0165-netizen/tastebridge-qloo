<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TasteBridge — Qloo Agentic Evening Planner</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#111}
h1{font-size:1.8rem} .tag{color:#555}
input{width:100%;padding:.7rem;font-size:1rem;margin:.5rem 0}
button{padding:.7rem 1.2rem;font-size:1rem;cursor:pointer}
.card{border:1px solid #ddd;border-radius:12px;padding:1rem;margin:.8rem 0}
.why{color:#444} .trace{font-size:.85rem;color:#666;white-space:pre-wrap}
.badge{display:inline-block;background:#eef;padding:.2rem .6rem;border-radius:999px;font-size:.85rem}
</style></head><body>
<h1>TasteBridge</h1>
<p class="tag">An agentic evening planner grounded in Qloo taste — your music/film taste
picks your dinner, your place, your wind-down. <span class="badge">MOCK MODE — live Qloo key pending</span></p>
<p>Try: <i>"Plan a romantic Bollywood evening in Los Angeles for 2"</i></p>
<input id="prompt" placeholder="Describe your evening… e.g. jazz evening in LA, cheap, 4 friends">
<button onclick="plan()">Plan my evening →</button>
<div id="out"></div>
<script>
async function plan(){
  const prompt=document.getElementById('prompt').value;
  const out=document.getElementById('out');
  out.innerHTML='<p>Agent is reasoning… parsing taste → Qloo search → cross-domain insights → critic…</p>';
  const r=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
  const d=await r.json(); const p=d.plan;
  if(p.error){ out.innerHTML='<div class="card"><b>Could not plan:</b> '+p.error+'</div>'; return; }
  let html='<h2>Your evening, by taste</h2><p>Seeds: '+p.seeds.map(s=>s.name).join(', ')+'</p>';
  p.stops.forEach(s=>{ html+='<div class="card"><b>'+s.time+'</b> — '+s.name+' ('+s.domain+')<div class="why">Why: '+s.why+'</div><div>Shared taste: '+(s.shared_tags||[]).join(', ')+'</div></div>'; });
  html+='<h3>Agent trace (judges: this is the agentic part)</h3><div class="trace">'+d.trace.join('\n')+'</div>';
  out.innerHTML=html;
}
</script></body></html>
